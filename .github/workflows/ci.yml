name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang make

      - name: Build (warnings as errors)
        run: make CC=${{ matrix.cc }} WERROR=1

      - name: Unit tests
        run: make CC=${{ matrix.cc }} WERROR=1 test

      - name: Sanitizers
        run: make CC=${{ matrix.cc }} sanitize

      - name: Sample run
        run: make CC=${{ matrix.cc }} run